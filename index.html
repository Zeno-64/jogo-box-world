<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <h1>Box World</h1>
    <p class="subtitle">o Sokoban dos Motorola BenQ (T190/T191, C200, C205, C300)</p>

    <div class="screen-bezel">
      <canvas id="screen" width="98" height="64"></canvas>
    </div>

    <div class="controls-row">
      <button id="toggleLight" class="pill">Luz: verde</button>
      <span class="hint">WASD ou setas move · Backspace desfaz · R reinicia · * mostra status · Esc abre o menu</span>
    </div>
  </div>

  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
