<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <h1>Box World</h1>
    <p class="subtitle">o Sokoban dos Motorola BenQ (T190/T191, C200, C205, C300)</p>

    <div class="phone" id="phone">
      <div class="earpiece"></div>
      <div class="screen-bezel">
        <canvas id="screen" width="98" height="64"></canvas>
      </div>

      <div class="softkeys">
        <button id="softLeft" class="softkey">Desfazer</button>
        <button id="softRight" class="softkey">Menu</button>
      </div>

      <div class="callkeys">
        <button id="callGreen" class="callkey green" title="Reiniciar a fase">&#9679; Reiniciar</button>
        <button id="callRed" class="callkey red" title="Abrir o menu">&#9679; Menu</button>
      </div>

      <div class="keypad">
        <button class="key" data-key="1">1</button>
        <button class="key nav" data-key="2">2<span>&#9650;</span></button>
        <button class="key" data-key="3">3</button>
        <button class="key nav" data-key="4">4<span>&#9664;</span></button>
        <button class="key" data-key="5">5</button>
        <button class="key nav" data-key="6">6<span>&#9654;</span></button>
        <button class="key" data-key="7">7</button>
        <button class="key nav" data-key="8">8<span>&#9660;</span></button>
        <button class="key" data-key="9">9</button>
        <button class="key" data-key="*">*</button>
        <button class="key" data-key="0">0</button>
        <button class="key" data-key="#">#</button>
      </div>
    </div>

    <div class="controls-row">
      <button id="toggleLight" class="pill">Luz: verde</button>
      <span class="hint">Teclado: setas ou 2/4/6/8 move · Backspace desfaz · R reinicia · * ou S mostra status · Esc abre o menu</span>
    </div>
  </div>

  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
